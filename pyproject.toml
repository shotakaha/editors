[project]
name = "doks"
description = "A skeleton repository for Python + uv + zensical"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "pre-commit>=4.7.0",
]
docs = [
    "zensical>=0.0.65",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
